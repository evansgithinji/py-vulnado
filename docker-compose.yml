services:
  vulnerable-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulnerable-goapp
    ports:
      - "4444:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/app.db
      - UPLOAD_DIR=/app/uploads
      - FILES_DIR=/app/files
      - IMAGES_DIR=/app/images
      - STATIC_DIR=/app/static
      - EXPORTS_DIR=/app/exports
      - BACKUPS_DIR=/app/backups
      # Intentionally exposed sensitive data for demo
      - SECRET_KEY=super_secret_key_12345
      - API_KEY=sk-live-abcdefghijklmnop
      - DATABASE_PASSWORD=db_pass_123
      - ADMIN_PASSWORD=admin_secret_pass
    volumes:
      # Persistent data volume for SQLite database
      - app-data:/app/data
      # Uploads volume
      - app-uploads:/app/uploads
      # Exports volume
      - app-exports:/app/exports
      # Backups volume
      - app-backups:/app/backups
    networks:
      - vulnerable-network
    restart: unless-stopped
    # Security note: Running as root for vulnerability demonstration
    # In production, you would use: user: "1000:1000"

  # Optional: Internal service for SSRF demonstration
  internal-api:
    image: nginx:alpine
    container_name: internal-api
    volumes:
      - ./internal-api/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./internal-api/html:/usr/share/nginx/html:ro
    networks:
      - vulnerable-network
    # Not exposed to host - only accessible from within the network

  # Optional: Metadata service mock for SSRF demonstration
  metadata-service:
    image: python:3.11-alpine
    container_name: metadata-service
    command: python -m http.server 80
    working_dir: /metadata
    volumes:
      - ./metadata:/metadata:ro
    networks:
      - vulnerable-network
    # Not exposed to host - only accessible from within the network

volumes:
  app-data:
  app-uploads:
  app-exports:
  app-backups:

networks:
  vulnerable-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
