server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /admin {
        return 200 '{"status": "admin", "secret": "internal_admin_token_xyz", "users": [{"id": 1, "role": "superadmin"}]}';
        add_header Content-Type application/json;
    }

    location /api/internal {
        return 200 '{"internal": true, "database_host": "db.internal:5432", "redis_host": "redis.internal:6379"}';
        add_header Content-Type application/json;
    }

    location /health {
        return 200 '{"status": "healthy", "service": "internal-api"}';
        add_header Content-Type application/json;
    }
}
